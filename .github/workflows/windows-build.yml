name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run tests
        run: pytest

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/dropwin.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DropWin-windows-x64
          path: dist/DropWin.exe
          if-no-files-found: error
